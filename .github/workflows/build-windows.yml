name: Build Windows installer

# Builds the Windows app on a GitHub-hosted Windows runner (Tauri can't
# cross-compile to Windows from macOS). Produces an unsigned NSIS .exe installer
# as a downloadable artifact — users click "More info -> Run anyway" past
# SmartScreen until code signing is added later.
#
# Triggered by pushing a tag: `win-*` for test builds, `v*` for releases.
# (workflow_dispatch is here too, but only works once this file reaches the
# repo's default branch.)

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'win*'
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      # --bundles nsis overrides the macOS-oriented targets in tauri.conf.json,
      # so this produces the Windows installer without touching that config.
      - name: Build Windows installer (unsigned)
        run: npm run tauri build -- --bundles nsis

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorkBase-Windows-Setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
