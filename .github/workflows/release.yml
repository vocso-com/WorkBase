name: Release

# Cuts installers for both desktop platforms from this exact source and attaches
# them to a DRAFT release, so nothing is published until a human looks at it.
#
# Trigger:  git tag v0.1.0 && git push origin v0.1.0
#           (or run manually from the Actions tab for a test build)
#
# macOS builds here are UNSIGNED, because the Developer ID certificate lives in a
# keychain, not in CI. Before publishing the draft, replace the .dmg with one
# built by scripts/release.sh, which signs, notarises and staples it. An unsigned
# DMG makes Gatekeeper say the developer "cannot be verified" - a bad first
# impression for an app whose whole claim is about trust.

# Manual for now: releases are cut locally so the macOS build can be signed with
# the Developer ID in the keychain. To go back to building on every version tag,
# uncomment the push trigger below.
on:
  workflow_dispatch: {}
  # push:
  #   tags:
  #     - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
            args: --target universal-apple-darwin
            artifact: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - os: windows-latest
            name: windows
            args: --bundles nsis
            artifact: src-tauri/target/release/bundle/nsis/*.exe
          - os: ubuntu-22.04
            name: linux
            args: --bundles appimage,deb
            artifact: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # A universal binary needs both architectures available to the linker.
      - name: Add macOS targets
        if: matrix.os == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      # Tauri's Linux webview is WebKitGTK, which is not present on the runner.
      # Pinned to 22.04 because the 4.1 dev package is what Tauri 2 links against.
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            build-essential \
            file

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      # Cheap insurance: never cut a release from a tree that does not pass.
      - run: npm run typecheck
      - run: npm test

      - name: Build installer
        run: npm run tauri build -- ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: workbase-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Draft the release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: dist/**/*
